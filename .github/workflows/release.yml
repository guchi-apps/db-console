name: Release

# Manual tag pushes only. Tags created by deploy.yml use the release job there
# because GITHUB_TOKEN pushes do not trigger other workflows.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない。Actionsの課金はジョブ単位で1分に切り上げられる
        # ため、数秒で終わるnotifyジョブが実行のたびに1分かかっていた。
        #
        # 通知はリリースの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_APP: db-console
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/signaly-notify.sh
