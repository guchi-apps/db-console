name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-db-console-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない。Actionsの課金はジョブ単位で1分に切り上げられる
        # ため、数秒で終わるnotify-releaseジョブが実行のたびに1分かかっていた。
        #
        # 通知はリリースの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_APP: db-console
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      HOST: ${{ secrets.SERVER_HOST }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      DB_CONSOLE_ADMIN_PASSWORD: ${{ secrets.DB_CONSOLE_ADMIN_PASSWORD }}
      DB_CONSOLE_ADMIN_USER: ${{ secrets.DB_CONSOLE_ADMIN_USER }}
      DB_CONSOLE_DATA_PASSWORD: ${{ secrets.DB_CONSOLE_DATA_PASSWORD }}
      DB_CONSOLE_DATA_USER: ${{ secrets.DB_CONSOLE_DATA_USER }}
      DB_CONSOLE_SCHEMA_PASSWORD: ${{ secrets.DB_CONSOLE_SCHEMA_PASSWORD }}
      DB_CONSOLE_SCHEMA_USER: ${{ secrets.DB_CONSOLE_SCHEMA_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CHECKPOINT_DISABLE: "1"
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_CONSOLE_DATA_USER: ${{ env.DB_CONSOLE_DATA_USER }}
          DB_CONSOLE_DATA_PASSWORD: ${{ env.DB_CONSOLE_DATA_PASSWORD }}
          DB_CONSOLE_SCHEMA_USER: ${{ env.DB_CONSOLE_SCHEMA_USER }}
          DB_CONSOLE_SCHEMA_PASSWORD: ${{ env.DB_CONSOLE_SCHEMA_PASSWORD }}

      - name: Create archive
        # scripts/construct-database-url.sh・scripts/update-env-file.sh は配布物から外した（#220）。
        # どちらもVPS上のデプロイ手順（.env の更新）でだけ使っていたもので、.env の更新は
        # app-deploy-gate が行う。アプリの実行時には読まない
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            package-lock.json \
            public \
            .next \
            prisma \
            prisma.config.ts \
            deploy \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      HOST: ${{ secrets.SERVER_HOST }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      DB_CONSOLE_ADMIN_PASSWORD: ${{ secrets.DB_CONSOLE_ADMIN_PASSWORD }}
      DB_CONSOLE_ADMIN_USER: ${{ secrets.DB_CONSOLE_ADMIN_USER }}
      DB_CONSOLE_DATA_PASSWORD: ${{ secrets.DB_CONSOLE_DATA_PASSWORD }}
      DB_CONSOLE_DATA_USER: ${{ secrets.DB_CONSOLE_DATA_USER }}
      DB_CONSOLE_SCHEMA_PASSWORD: ${{ secrets.DB_CONSOLE_SCHEMA_PASSWORD }}
      DB_CONSOLE_SCHEMA_USER: ${{ secrets.DB_CONSOLE_SCHEMA_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#301）へ渡す**（#220）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名 db-console
      # （置き場 /home/github-user/apps/db-console）を固定する。任意のシェルコマンドは実行できず、
      # upload・env・deployの3語だけが通る。旧配布物の削除・展開・.env更新・npm ci --omit=dev・
      # prisma migrate deploy・pm2の再起動（deploy/ecosystem.config.js が宣言する db-console）・
      # 稼働版の照合（.env の APP_COMMIT_SHA と /api/app-version の sha。最大60秒）はgate側が行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz

      - name: Send environment variables
        env:
          # 稼働している版の照合に使う（#220）。gateが.envのAPP_COMMIT_SHAと稼働中の/api/app-versionの
          # shaを照合する（guchi-apps/vps#298）。コミットのSHAは公開情報なのでそのまま渡してよい
          APP_COMMIT_SHA: ${{ github.sha }}
          # マイグレーション専用ユーザー（DDL権限あり）。gateは.envへ書かずマイグレーションだけに使う。
          # 未設定の環境では通常ユーザーへフォールバックする
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          DB_CONSOLE_DATA_USER: ${{ env.DB_CONSOLE_DATA_USER }}
          DB_CONSOLE_DATA_PASSWORD: ${{ env.DB_CONSOLE_DATA_PASSWORD }}
          DB_CONSOLE_SCHEMA_USER: ${{ env.DB_CONSOLE_SCHEMA_USER }}
          DB_CONSOLE_SCHEMA_PASSWORD: ${{ env.DB_CONSOLE_SCHEMA_PASSWORD }}
          DB_CONSOLE_ADMIN_USER: ${{ env.DB_CONSOLE_ADMIN_USER }}
          DB_CONSOLE_ADMIN_PASSWORD: ${{ env.DB_CONSOLE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          for name in MIGRATE_DATABASE_URL DATABASE_URL DB_USER DB_PASSWORD DB_HOST DB_PORT DB_NAME ISSUE_DECK_URL SHARED_TOKEN_API_SECRET DB_CONSOLE_DATA_USER DB_CONSOLE_DATA_PASSWORD DB_CONSOLE_SCHEMA_USER DB_CONSOLE_SCHEMA_PASSWORD DB_CONSOLE_ADMIN_USER DB_CONSOLE_ADMIN_PASSWORD; do
            case "${!name:-}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ
          # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#36）。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3109"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL:-$DATABASE_URL}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL:-}"
            printf '%s\n' "DB_USER=${DB_USER:-}"
            printf '%s\n' "DB_PASSWORD=${DB_PASSWORD:-}"
            printf '%s\n' "DB_HOST=${DB_HOST:-}"
            printf '%s\n' "DB_PORT=${DB_PORT:-}"
            printf '%s\n' "DB_NAME=${DB_NAME:-}"
            printf '%s\n' "ISSUE_DECK_URL=${ISSUE_DECK_URL:-}"
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET:-}"
            printf '%s\n' "DB_CONSOLE_DATA_USER=${DB_CONSOLE_DATA_USER:-}"
            printf '%s\n' "DB_CONSOLE_DATA_PASSWORD=${DB_CONSOLE_DATA_PASSWORD:-}"
            printf '%s\n' "DB_CONSOLE_SCHEMA_USER=${DB_CONSOLE_SCHEMA_USER:-}"
            printf '%s\n' "DB_CONSOLE_SCHEMA_PASSWORD=${DB_CONSOLE_SCHEMA_PASSWORD:-}"
            printf '%s\n' "DB_CONSOLE_ADMIN_USER=${DB_CONSOLE_ADMIN_USER:-}"
            printf '%s\n' "DB_CONSOLE_ADMIN_PASSWORD=${DB_CONSOLE_ADMIN_PASSWORD:-}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない（notify-releaseと同じ理由）。deployが動かなかった
        # 場合（tag/buildで失敗・キャンセル）の通知は下のnotifyジョブが受け持つ。
        #
        # 通知はデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: db-console
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ job.status }}
        run: bash .github/scripts/signaly-notify.sh

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    # deployジョブが動かなかったとき（tag/buildで失敗・キャンセルし、deployがskipされた
    # とき）だけの保険。deployが動いた場合の通知はdeployジョブの最終ステップが送る。
    # Actionsの課金はジョブ単位で1分に切り上げられるため、成功時に数秒の通知専用ジョブを
    # 立てない。
    if: always() && needs.deploy.result == 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: db-console
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh
