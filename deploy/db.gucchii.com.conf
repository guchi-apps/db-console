# Apache VirtualHost for db-console (Next.js + pm2)
# apache-vhost.example.conf を実際の値で埋めたもの。
# VPS の Apache 設定ディレクトリに配置して有効化し、certbot で SSL を設定する。

<VirtualHost *:80>
    ServerName db.gucchii.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass / http://127.0.0.1:3109/
    ProxyPassReverse / http://127.0.0.1:3109/
</VirtualHost>

<VirtualHost *:443>
    ServerName db.gucchii.com

    SSLEngine on
    # certbot --apache -d db.gucchii.com で自動設定される想定
    # SSLCertificateFile /etc/letsencrypt/live/db.gucchii.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/db.gucchii.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:3109/
    ProxyPassReverse / http://127.0.0.1:3109/
</VirtualHost>
